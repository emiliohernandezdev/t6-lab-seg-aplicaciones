# Gateway de la T6. Es lo unico que se publica al host (127.0.0.1:8443).
worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    server_tokens off;
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # uso $uri y no $request para que no quede la query string, y no
    # logueo ningun header (ni Authorization ni cookies)
    log_format seguro '$remote_addr [$time_iso8601] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent rt=$request_time up=$upstream_status rid=$request_id';
    access_log /dev/stdout seguro;
    access_log /var/log/gateway/access.log seguro;
    error_log  /dev/stderr warn;

    # limite por IP, aparte del limite por usuario que hace la API
    limit_req_zone $binary_remote_addr zone=por_ip:10m rate=30r/s;
    limit_req_status 429;

    upstream orders_api {
        server orders-api:8443;
        keepalive 16;
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/gateway.crt;
        ssl_certificate_key /etc/nginx/certs/gateway.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-store" always;

        limit_req zone=por_ip burst=100 nodelay;

        # mTLS hacia la API: presento mi cert de cliente y verifico el de ella
        proxy_ssl_certificate         /etc/nginx/certs/gateway-client.crt;
        proxy_ssl_certificate_key     /etc/nginx/certs/gateway-client.key;
        proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
        proxy_ssl_verify       on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_name         orders-api;
        proxy_ssl_server_name  on;
        proxy_ssl_protocols    TLSv1.2 TLSv1.3;
        proxy_ssl_session_reuse on;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Request-ID      $request_id;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout    10s;

        # solo estas rutas pasan; /healthz, /docs, etc. de la API no se publican
        location = /api/orders              { limit_except GET POST  { deny all; } proxy_pass https://orders_api; }
        location ~ "^/api/orders/[0-9]{1,9}$" { limit_except GET     { deny all; } proxy_pass https://orders_api; }
        location = /api/profile             { limit_except GET PATCH { deny all; } proxy_pass https://orders_api; }
        location = /api/admin/audit         { limit_except GET       { deny all; } proxy_pass https://orders_api; }
        location = /graphql                 { limit_except POST      { deny all; } proxy_pass https://orders_api; }

        location / {
            default_type application/json;
            return 404 '{"detail":"ruta no publicada por el gateway"}';
        }
    }
}
