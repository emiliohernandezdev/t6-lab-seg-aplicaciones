# T6 - servicio de pedidos
#
#   bash scripts/gen_certs.sh                       (una sola vez, Git Bash)
#   docker compose up -d --build
#   docker compose --profile test run --rm tests    (pytest)
#
# Al host solo salen el gateway (8443) y Keycloak (8080, para pedir tokens),
# los dos en 127.0.0.1. orders-api no tiene ports: vive en la red backend.
name: t6-orders

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-solo-lab-cambiar}
      # asi el iss es siempre localhost:8080 aunque el token se pida desde la red de docker
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: info
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks: [frontend, backend]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  orders-api:
    build: ./src
    environment:
      INSECURE_MODE: ${INSECURE_MODE:-false}
      APP_PROFILE: ${APP_PROFILE:-prod}
      OIDC_ISSUER: http://localhost:8080/realms/lab
      OIDC_JWKS_URL: http://keycloak:8080/realms/lab/protocol/openid-connect/certs
      OIDC_AUDIENCE: orders-api
      RATE_LIMIT_MAX: "10"
      RATE_LIMIT_WINDOW_S: "10"
    volumes:
      - ./certs/orders-api.crt:/certs/orders-api.crt:ro
      - ./certs/orders-api.key:/certs/orders-api.key:ro
      - ./certs/ca.crt:/certs/ca.crt:ro
    # sin ports a proposito
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      keycloak:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/gateway.crt:/etc/nginx/certs/gateway.crt:ro
      - ./certs/gateway.key:/etc/nginx/certs/gateway.key:ro
      - ./certs/gateway-client.crt:/etc/nginx/certs/gateway-client.crt:ro
      - ./certs/gateway-client.key:/etc/nginx/certs/gateway-client.key:ro
      - ./certs/ca.crt:/etc/nginx/certs/ca.crt:ro
      - gateway-logs:/var/log/gateway
    ports:
      - "127.0.0.1:8443:8443"
    networks: [frontend, backend]
    security_opt: ["no-new-privileges:true"]
    depends_on: [orders-api]
    restart: unless-stopped

  # pytest. Va en la red interna para poder probar el mTLS directo contra orders-api
  tests:
    build: ./tests
    profiles: ["test"]
    environment:
      GATEWAY_URL: https://gateway:8443
      KEYCLOAK_URL: http://keycloak:8080
      ORDERS_API_URL: https://orders-api:8443
      CERTS_DIR: /certs
      GATEWAY_LOG: /gateway-logs/access.log
      COMPOSE_FILE_PATH: /work/docker-compose.yml
    volumes:
      - ./tests:/work/tests:ro
      - ./scripts:/work/scripts:ro
      - ./evidencias:/work/evidencias
      - ./docker-compose.yml:/work/docker-compose.yml:ro
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/gateway-client.crt:/certs/gateway-client.crt:ro
      - ./certs/gateway-client.key:/certs/gateway-client.key:ro
      - ./certs/untrusted-ca.crt:/certs/untrusted-ca.crt:ro
      - ./certs/untrusted-client.crt:/certs/untrusted-client.crt:ro
      - ./certs/untrusted-client.key:/certs/untrusted-client.key:ro
      - gateway-logs:/gateway-logs:ro
    networks: [frontend, backend]
    depends_on:
      keycloak:
        condition: service_healthy
      gateway:
        condition: service_started

networks:
  frontend: {}
  backend:
    internal: true   # sin salida a internet

volumes:
  gateway-logs: {}
